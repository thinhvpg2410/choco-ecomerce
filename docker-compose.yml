services:
  db:
    image: postgres:16-alpine
    container_name: choco-db
    environment:
      POSTGRES_DB: choco_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d choco_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: choco-api
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/choco_ecommerce?schema=public
      JWT_SECRET: d7a8b5310c2e491944963cac158973549e48891320a80b2dd2c2fbc9058e916e
      JWT_REFRESH_SECRET: 3144049e5030d0eb0db1df3e2e6352a54b6ce1bd1701c588b61d83e78dde5972
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
