stages:
  - install
  - test
  - build
  - publish
  - deploy

default:
  image: node:20-bullseye

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
    - node_modules

install_dependencies:
  stage: install
  script:
    - npm ci

lint:
  stage: test
  script:
    - npm ci
    - npm run lint --workspace=api
    - npm run lint --workspace=web

test:
  stage: test
  script:
    - npm ci
    - npm run test --workspace=api -- --runInBand

build_app:
  stage: build
  script:
    - npm ci
    - npm run build --workspace=api
    - npm run build --workspace=web

build_and_push_image:
  stage: publish
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_IMAGE_REPO: "docker.io/thinhvpg2410/choco-api"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  before_script:
    - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin
  script:
    # Use branch name and unique pipeline IID as image tag
    - export IMAGE_TAG="${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    - docker build -f apps/api/Dockerfile -t "${DOCKER_IMAGE_REPO}:${IMAGE_TAG}" -t "${DOCKER_IMAGE_REPO}:latest" .
    - docker push "${DOCKER_IMAGE_REPO}:${IMAGE_TAG}"
    - docker push "${DOCKER_IMAGE_REPO}:latest"

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    DEPLOY_HOST: "13.212.14.45"
    DEPLOY_USER: "ubuntu"
    DEPLOY_PATH: "/opt/choco-ecomerce"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
    - scp docker-compose.prod.yml ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml
    - ssh ${DEPLOY_USER}@${DEPLOY_HOST} "set -e && cd ${DEPLOY_PATH} && API_IMAGE=${DOCKER_IMAGE_REPO}:latest docker compose -f docker-compose.prod.yml pull api && API_IMAGE=${DOCKER_IMAGE_REPO}:latest docker compose -f docker-compose.prod.yml up -d"
