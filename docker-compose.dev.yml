services:
  db:
    image: postgres:16-alpine
    container_name: choco-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: choco_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d choco_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: choco-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: choco-api-dev
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/choco_ecommerce?schema=public
      JWT_SECRET: d7a8b5310c2e491944963cac158973549e48891320a80b2dd2c2fbc9058e916e
      JWT_REFRESH_SECRET: 3144049e5030d0eb0db1df3e2e6352a54b6ce1bd1701c588b61d83e78dde5972
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TTL_SECONDS: "60"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    mem_limit: 1536m
    cpus: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: choco-nginx-dev
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.2

volumes:
  postgres_data_dev: